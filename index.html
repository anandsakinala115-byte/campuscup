<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <title>CampusCup — Competition Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="CampusCup home"><span class="brand-mark">C</span><span>campus<span class="brand-light">cup</span></span></a>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">◫</span> Overview</button>
        <button class="nav-item" data-view="competitions"><span class="nav-icon">▦</span> Competitions <span class="nav-count" id="navCount">0</span></button>
        <button class="nav-item" data-view="registrations"><span class="nav-icon">♧</span> Registrations</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card"><div class="help-icon">✦</div><strong>Need a hand?</strong><p>Keep your campus events running smoothly.</p><button id="helpButton">View quick guide <span>↗</span></button></div>
        <div class="profile"><div class="avatar">AM</div><div class="profile-copy"><strong>Admin Manager</strong><span>Campus admin</span></div><button class="more-button" aria-label="Profile options">···</button></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button class="mobile-menu" id="menuButton" aria-label="Open menu">☰</button><div class="breadcrumb">Campus events <span>/</span> <strong id="crumb">Overview</strong></div><div class="top-actions"><span class="today-label" id="todayLabel"></span><button class="icon-button" id="bellButton" aria-label="Notifications">♧<i></i></button><div class="top-avatar">AM</div></div></header>
      <div class="content" id="content"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><p class="eyebrow" id="modalEyebrow">NEW ENTRY</p><h2 id="modalTitle">Add competition</h2></div><button class="close-button" id="closeModal" aria-label="Close">×</button></div><form id="recordForm" novalidate><div id="formFields"></div><div class="form-error" id="formError"></div><div class="modal-actions"><button type="button" class="button button-quiet" id="cancelModal">Cancel</button><button type="submit" class="button button-primary" id="submitButton">Create competition <span>→</span></button></div></form></section></div>
  <script src="app.js"></script>
</body>
</html>
